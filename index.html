<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 모니터</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="login" class="login hidden"><form id="login-form"><p class="eyebrow">VIBECODINGUNIV</p><h1>상품 모니터</h1><p>관리자 비밀번호를 입력하세요.</p><input id="token" type="password" autocomplete="current-password" placeholder="관리자 비밀번호" required><button>로그인</button><small id="login-error"></small></form></div>
<main id="app" class="hidden"><header><div><p class="eyebrow">VIBECODINGUNIV.CAFE24.COM</p><h1>상품 모니터</h1><p id="last-seen">아직 수집한 상품이 없습니다.</p></div><div class="header-actions"><button class="secondary" id="logout">로그아웃</button><button id="collect">지금 수집</button></div></header>
<section class="metrics"><article><span>전체 상품</span><b id="total">0</b></article><article><span>판매 중</span><b id="available">0</b></article><article><span>품절</span><b id="soldout">0</b></article><article><span>최근 실행</span><b id="run">-</b></article></section>
<section class="toolbar"><input id="search" placeholder="상품명 검색"><select id="category"><option value="">전체 카테고리</option></select><select id="state"><option value="">전체 상태</option><option value="available">판매 중</option><option value="soldout">품절</option><option value="inactive">목록 제외</option></select><span id="notice"></span></section>
<section><div class="table-head"><h2>상품 목록</h2><span id="count"></span></div><div class="table-wrap"><table><thead><tr><th>상품</th><th>카테고리</th><th>가격</th><th>상태</th><th>마지막 확인</th></tr></thead><tbody id="products"><tr><td colspan="5" class="empty">수집 버튼을 눌러 첫 상품 목록을 불러오세요.</td></tr></tbody></table></div></section>
<footer>공개 상품 정보만 낮은 속도로 수집합니다. Vercel 무료 플랜에서는 자동 수집을 하루 1회로 제한합니다.</footer></main><script src="/app.js"></script></body></html>
